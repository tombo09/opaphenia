<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>opaphenia</title>
   <link rel="stylesheet" href="/css/main.css">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<div id="msgToast" class="msgToast"></div>

<body>
<div class="topbar">
<div class="leftArea">
  <button id="homeBtn" class ="btn">home</button>

  <div class="searchBox">
    <div class="searchRow">
      <input id="searchAccInput" type="text" placeholder="search username" />
    </div>
    <div id="searchResults" class="searchDropdown"></div>
  </div>
</div>
  <div class="rightArea">
    <button id="overviewBtn" style="display:none;">Overview</button>
    <button id="accountBtn" class ="btn">Account</button>
    <button id="logoutBtn" class ="btn" style="display:none;">Logout</button>
  </div>
</div>
<div id="homeView" class="view" style="display:none;">
  <div class="typingWrap">
    <h2 id="typingTitle" class="typingDiagonal"></h2>
  </div>
</div>
  <p id="msg"></p>

  <!-- Views -->
<div id="loginView" class="view" style="display:none;">
  <div class="card loginCard">
    <input id="loginInput" type="text" placeholder="email or username..." />
    <input id="loginPasswordInput" type="password" placeholder="type password..." />
    <div class="btnRow">
      <button id="loginBtn" class ="btn">logIn</button>
      <button id="openSignupBtn" class ="btn">new account</button>
    </div>
    <button id="resetPwBtn" class="btn" style="display:none;">Reset password</button>
  </div>
</div>

<div id="signupView" class="view" style="display:none;">
  <div class="card loginCard">

    <input id="signupEmailInput" type="email" placeholder="type email..." />
    <input id="signupUsernameInput" type="text" placeholder="choose username..." />
    <input id="signupPasswordInput" type="password" placeholder="type password..." />

    <!-- Honeypot gegen einfache Bots -->
    <input
      id="website"
      name="website"
      type="text"
      autocomplete="off"
      tabindex="-1"
      aria-hidden="true"
      class="hp-field"
    />

    <!-- Cloudflare Turnstile -->
    <div
      class="cf-turnstile"
      data-sitekey="0x4AAAAAADKXaymjn1wmLr6A"
      data-callback="onTurnstileSuccess"
      data-theme="light"
      data-expired-callback="onTurnstileExpired"
    ></div>

    <div class="btnRow">
      <button id="signupBtn" class="btn">create account</button>
      <button id="backToLoginBtn" class="btn">back</button>
    </div>

  </div>
</div>

<div id="overviewView" class="view" style="display:none;">
  <div class="card">
    <div class="postBtnRow" style="margin-bottom:12px;">
      <button id="openPostModalBtn" class="btn btnPost">+</button>
    </div>

    <div id="stringsList" style="margin-top:12px;"></div>
  </div>
</div>

<div id="stringsList" style="margin-top:12px;"></div>

      <div id="stringsList" style="display:none; margin-top:12px;"></div>
    </div>
  </div>

  <div id="accountView" class="view" style="display:none;">
    <div class="card accountCard">
      <h3 id="accountUsername"></h3>

      <label class="row">
        <input type="checkbox" id="publicStringsChk" />
        Make my written strings public
      </label>
      <button id="saveVisibilityBtn">save</button>

      <hr />

      <h4>Email</h4>
      <input id="accountEmail" type="email" readonly />
      <div class="btnRow">
        <button id="saveEmailBtn" style="display:none;">Save</button>
        <button id="cancelEmailBtn" style="display:none;">Cancel</button>
      </div>

      <h4>Password</h4>
      <input id="oldPw" type="password" placeholder="old password" />
      <input id="newPw" type="password" placeholder="new password" />
      <input id="newPw2" type="password" placeholder="repeat new password" />
      <button id="savePwBtn">save</button>
      <hr />

      <div class="accountSection">
        <h4>Time zone</h4>
        <select id="accountTimezone">
          <option value="Europe/Berlin">Europe/Berlin</option>
          <option value="UTC">UTC</option>
          <option value="Europe/London">Europe/London</option>
          <option value="America/New_York">America/New_York</option>
          <option value="America/Los_Angeles">America/Los_Angeles</option>
          <option value="Asia/Tokyo">Asia/Tokyo</option>
        </select>
        <button id="saveTimezoneBtn">save</button>
      </div>
    </div>
  </div>

<div id="searchView" class="view" style="display:block;">
  <div class="card">
    <div id="publicStringsList" style="margin-top:12px;"></div>
  </div>
</div>

<div id="postModalOverlay" class="modalOverlay" style="display:none;">
  <div class="modalCard">
    <button id="closePostModalBtn" class="modalCloseBtn" type="button">×</button>
    <h3 style="text-align:center;">New thought</h3>
    <div id="writeForm">
      <textarea id="stringInput" placeholder="type your thoughts..."></textarea>
      <div id="stringCounter">0 / 500</div>
      <div class="postBtnRow">
        <button id="saveBtn" class="btn btnPost" type="button">
          <span class="btnLabel">push it!</span>
        </button>
      </div>
    </div>
  </div>
</div>
<div id="proofHashModal" class="modalOverlay" style="display:none;">
  <div class="modalCard">
    <button id="closeProofHashModalBtn" class="modalCloseBtn" type="button">&times;</button>
    <h3 style="text-align:center;">reproduce hash</h3>
    <pre id="proofHashCodeBox" class="proofHashCodeBox"></pre>
  </div>
</div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
